<div class="relative grid min-h-screen place-items-center bg-surface px-4 py-12 text-foreground">
  <button
    type="button"
    class="absolute right-4 top-4 grid h-9 w-9 place-items-center rounded-md border border-border bg-card text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.isDark() ? 'Use light theme' : 'Use dark theme'"
    [attr.title]="theme.isDark() ? 'Use light theme' : 'Use dark theme'"
  >
    <ion-icon [name]="theme.isDark() ? 'sunny-outline' : 'moon-outline'" class="text-lg"></ion-icon>
  </button>

  <section class="w-full max-w-[390px] rounded-2xl border border-border bg-card p-8 shadow-auth">
    <div class="mb-6 text-center">
      <span
        class="mx-auto grid h-[42px] w-[42px] place-items-center rounded-lg bg-primary text-primary-foreground"
      >
        <ion-icon name="book-outline" class="text-xl"></ion-icon>
      </span>
      <h1 class="mb-0 mt-4 text-xl font-bold tracking-tight">{{ title() }}</h1>
      <p class="mb-0 mt-1.5 text-sm text-muted-foreground">{{ subtitle() }}</p>
    </div>
    <ng-content></ng-content>
  </section>
</div>
